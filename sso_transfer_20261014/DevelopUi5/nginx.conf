events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    set_real_ip_from        0.0.0.0/0;
    real_ip_recursive       on;
    real_ip_header          X-Forward-For;
    limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Бэк SSO (backend/server.js). В docker-compose — имя сервиса, иначе host:port.
    upstream sso_backend {
        server backend:3001;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ─────────────────────────────────────────────────────────────────
        # SSO: бэк (Node) на том же origin, что и фронт.
        #   /auth/*  — сессия: /auth/me, /auth/login, /auth/logout,
        #              /auth/saml/acs (POST от ADFS), /auth/saml/metadata
        #   /odata/* — прокси в OData SAP от имени пользователя сессии
        #   /health  — проверка живости бэка
        # Зачем same-origin: httpOnly-кука сессии бэка ставится на этот же
        # хост, браузер шлёт её с запросами фронта без SameSite=None и без
        # CORS с credentials. Фронт собирать с пустым VITE_API_URL.
        #
        # ^~ обязателен: иначе regex-location статики ниже (\.(js|css|svg)…)
        # перехватит, например, /odata/...$metadata или /auth/...svg.
        # Адрес бэка (upstream) поменяйте под свой контур.
        # ─────────────────────────────────────────────────────────────────
        location ^~ /auth/ {
            proxy_pass              http://sso_backend;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_redirect          off;      # 302 на IdP/returnTo отдаём как есть
            proxy_buffering         off;
            add_header              Cache-Control "no-store" always;
        }

        location ^~ /odata/ {
            proxy_pass              http://sso_backend;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_read_timeout      300s;     # тяжёлые выборки SAP (аналитика, реестр платежей)
            client_max_body_size    10m;      # $batch / PATCH задач
            add_header              Cache-Control "no-store" always;
        }

        location = /health {
            proxy_pass              http://sso_backend;
            proxy_set_header        Host $host;
        }

        # Handle client-side routing
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

#         proxy_pass http://myIP:3000;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection 'upgrade';
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header Host $host;
#         proxy_cache_bypass $http_upgrade;    
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    }
}
